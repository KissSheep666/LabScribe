[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labscribe"
version = "0.1.0"
description = "LabScribe: lab operation recording agent (vision -> events -> LLM tool calls)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LabScribe" }]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python>=4.9",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3",
  "paddleocr>=2.7",
  "paddlepaddle>=2.6",
  "supervision>=0.21",
  "lap>=0.5",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
labscribe = "labscribe.cli:main"

[tool.setuptools.packages.find]
include = ["labscribe*"]

[tool.setuptools.package-data]
labscribe = ["api/static/*.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
