<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230d1117'/><text x='32' y='44' font-size='28' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%2337d0b0'>LS</text></svg>" />
<title>实验档案问答 · LabScribe</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #131b24;
    --panel-2: #18222d;
    --line: #24303d;
    --text: #c9d5e2;
    --muted: #7f8f9f;
    --accent: #37d0b0;
    --info: #6cb6ff;
    --warn: #f5b64b;
    --danger: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: #10261f; border: 1px solid #2b6b5c; color: var(--accent);
    font-weight: 800; font-size: 12px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .head-links { display: flex; gap: 14px; font-size: 13px; }
  .head-links a { color: var(--muted); text-decoration: none; }
  .head-links a:hover { color: var(--accent); }

  main {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
  }
  .conversation { display: flex; flex-direction: column; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #26323f; border-radius: 8px; }

  .msg { display: flex; gap: 12px; max-width: 900px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .msg.user .avatar { background: #1c2b3a; border: 1px solid #2e4a63; color: var(--info); }
  .msg.assistant .avatar { background: #10261f; border: 1px solid #2b6b5c; color: var(--accent); }
  .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 15px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #16232f; }
  .bubble .meta { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .bubble .meta a { color: var(--info); text-decoration: none; }
  .bubble .meta a:hover { text-decoration: underline; }
  .bubble .warn { color: var(--warn); }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cite {
    font: 11px/1.5 Consolas, "Cascadia Code", monospace;
    background: #16222d; border: 1px solid #26323f; border-radius: 6px;
    padding: 2px 7px; color: #9fc8e8; cursor: pointer;
  }
  .cite:hover { border-color: #3b5a75; color: var(--info); }

  .empty {
    margin: auto; max-width: 560px; text-align: center; color: var(--muted);
    display: flex; flex-direction: column; gap: 14px; padding: 30px;
  }
  .empty h2 { color: #e6eef7; font-size: 18px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: 13px; color: var(--text); cursor: pointer;
  }
  .chip:hover { border-color: #3b5a75; color: var(--info); }

  .composer { border-top: 1px solid var(--line); padding: 14px 22px 18px; }
  .composer form { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 180px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font: inherit; outline: none;
  }
  textarea:focus { border-color: #2b6b5c; }
  button {
    background: #167a6a; color: #ecfffb; border: 1px solid #2b8f7d;
    border-radius: 10px; padding: 12px 18px; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); padding: 8px 12px; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

  aside {
    border-left: 1px solid var(--line); background: #0f151d;
    padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
  .stat .v { font-size: 18px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .src {
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 11px; font-size: 12px; cursor: pointer;
  }
  .src:hover { border-color: #35506a; }
  .src .id { font-family: Consolas, monospace; color: #9fc8e8; font-size: 11px; }
  .src .row { color: var(--muted); margin-top: 3px; }
  .src .note { color: #c3d3e2; margin-top: 4px; }
  .src .thumb { width: 100%; margin-top: 7px; border-radius: 6px; border: 1px solid #26323f; display: block; }
  .tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid #2b394a; color: #a8bfd6; margin-right: 4px;
  }
  .tag.critical { color: #ff9c9c; border-color: #7a3434; }
  .tag.warning { color: var(--warn); border-color: #6f5720; }
  .tag.record { color: #8fd7c6; border-color: #2b6b5c; }

  #modal {
    position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
    background: #05080cbb; z-index: 50;
  }
  #modal.open { display: grid; }
  .modal-box {
    width: min(860px, 95vw); max-height: 86vh; overflow: auto;
    background: #101720; border: 1px solid #2a3a4c; border-radius: 14px; padding: 20px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  pre {
    background: #0a0f15; border: 1px solid var(--line); border-radius: 9px; padding: 12px;
    font: 12px/1.6 Consolas, "Cascadia Code", monospace; color: #b8cadd;
    overflow: auto; max-height: 380px; white-space: pre-wrap; word-break: break-word;
  }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
    aside { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">LS</div>
    <h1>实验档案问答<span class="sub">基于已归档的记录、事件与原始帧</span></h1>
  </div>
  <div class="head-links">
    <a href="/">← 返回 Dashboard</a>
    <a href="#" id="clearBtn">清空对话</a>
  </div>
</header>

<main>
  <section class="conversation">
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <h2>问关于实验档案的任何问题</h2>
        <p>回答只依据数据库里已归档的记录、事件、告警和 SOP，并附上可点击的 record / frame 编号。</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div class="composer">
      <form id="form">
        <textarea id="input" rows="1" placeholder="例如：最近一次实验做到哪一步？有没有超限读数？"></textarea>
        <button type="submit" id="send">发送</button>
      </form>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · 点击右侧「引用来源」可查看原始记录与帧</div>
    </div>
  </section>

  <aside>
    <div>
      <h2>档案概况</h2>
      <div class="stat-grid" id="stats" style="margin-top:8px"></div>
    </div>
    <div>
      <h2>引用来源 <span id="srcCount" style="color:var(--accent)"></span></h2>
      <div id="sources" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <div class="src"><span class="row">提问后这里会列出回答所依据的记录。</span></div>
      </div>
    </div>
  </aside>
</main>

<div id="modal" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modalTitle">详情</strong>
      <button class="ghost" onclick="closeModal()">关闭</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
const fmtTime = (ts) => {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  if (Number.isNaN(d.getTime())) return "—";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

let history = [];
let sources = [];

async function getJSON(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error((await res.text()).slice(0, 200));
  return res.json();
}

async function loadStats() {
  try {
    const s = await getJSON("/api/stats");
    const items = [
      ["记录", s.records], ["事件", s.events],
      ["告警", s.alerts], ["会话", s.sessions],
    ];
    $("stats").innerHTML = items.map(([k, v]) =>
      `<div class="stat"><div class="v">${esc(v ?? 0)}</div><div class="k">${esc(k)}</div></div>`
    ).join("");
  } catch (e) { /* ignore */ }
}

async function loadSuggestions() {
  try {
    const d = await getJSON("/api/chat/suggestions");
    $("chips").innerHTML = d.suggestions.map(s =>
      `<button type="button" class="chip" data-q="${esc(s)}">${esc(s)}</button>`
    ).join("");
    $("chips").querySelectorAll(".chip").forEach(btn => {
      btn.onclick = () => { $("input").value = btn.dataset.q; $("form").requestSubmit(); };
    });
    if (!d.has_data) {
      $("empty").querySelector("p").innerHTML =
        "档案还是空的。先运行 <code>python -m labscribe simulate --agent rules</code> 生成一批数据，再回来提问。";
    }
  } catch (e) { /* ignore */ }
}

function addMessage(role, text, extra = "") {
  const empty = $("empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `
    <div class="avatar">${role === "user" ? "你" : "LS"}</div>
    <div class="bubble">${esc(text)}${extra}</div>`;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}

function renderSources(list) {
  sources = list || [];
  $("srcCount").textContent = sources.length ? `(${sources.length})` : "";
  if (!sources.length) {
    $("sources").innerHTML = `<div class="src"><span class="row">这个问题没有命中任何记录。</span></div>`;
    return;
  }
  $("sources").innerHTML = sources.map((s, i) => {
    if (s.kind === "alert") {
      return `<div class="src" data-i="${i}">
        <span class="tag ${esc(s.severity)}">${esc(s.severity)}</span>
        <span class="id">${esc(s.event_id || "")}</span>
        <div class="note">${esc(s.message)}</div>
      </div>`;
    }
    return `<div class="src" data-i="${i}">
      <span class="tag record">record</span>
      <span class="id">${esc(s.record_id)}</span>
      <div class="row">${esc(s.step_id || "--")} · ${esc(s.event_type || "")} · ${fmtTime(s.created_at)}</div>
      <div class="note">${esc(s.note)}</div>
      ${s.frame_url ? `<img class="thumb" loading="lazy" src="${esc(s.frame_url)}" alt="">` : ""}
    </div>`;
  }).join("");
  $("sources").querySelectorAll(".src").forEach(el => {
    el.onclick = () => openSource(sources[Number(el.dataset.i)]);
  });
}

async function openSource(s) {
  if (!s) return;
  if (s.kind === "alert") {
    if (s.event_id) return showEvent(s.event_id);
    return;
  }
  try {
    const d = await getJSON(`/api/records/${encodeURIComponent(s.record_id)}/trace`);
    $("modalTitle").textContent = `记录追溯 ${s.record_id}`;
    $("modalBody").innerHTML = `
      <div style="color:var(--muted);font-size:12px;margin-bottom:10px">
        追溯链：record → event → frame
      </div>
      ${d.frame ? `<img src="${esc(d.frame.url)}" style="max-width:100%;border-radius:8px;border:1px solid var(--line)">` : ""}
      <pre>${esc(JSON.stringify({ record: d.record, event: d.event }, null, 2))}</pre>`;
    $("modal").classList.add("open");
  } catch (e) {
    alert("加载失败: " + e.message);
  }
}

async function showEvent(eventId) {
  try {
    const d = await getJSON(`/api/events/${encodeURIComponent(eventId)}`);
    $("modalTitle").textContent = `事件 ${eventId}`;
    $("modalBody").innerHTML = `
      ${d.frame ? `<img src="${esc(d.frame.url)}" style="max-width:100%;border-radius:8px;border:1px solid var(--line)">` : ""}
      <pre>${esc(JSON.stringify({ event: d.event, records: d.records, alerts: d.alerts }, null, 2))}</pre>`;
    $("modal").classList.add("open");
  } catch (e) { alert("加载失败: " + e.message); }
}

function closeModal() { $("modal").classList.remove("open"); }

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const input = $("input");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  input.style.height = "auto";
  addMessage("user", q);
  const thinking = addMessage("assistant", "正在检索档案…");
  $("send").disabled = true;
  try {
    const data = await getJSON("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, history }),
    });
    const cites = (data.sources || []).slice(0, 5).map(s =>
      s.kind === "alert"
        ? `<span class="cite" data-ev="${esc(s.event_id || "")}">${esc(s.severity)} ${esc((s.message || "").slice(0, 22))}</span>`
        : `<span class="cite" data-rec="${esc(s.record_id)}">${esc(s.record_id)}</span>`
    ).join("");
    const metaBits = [];
    if (data.mode === "search") metaBits.push("检索模式（未使用 LLM）");
    else metaBits.push(`LLM · ${data.latency_ms} ms`);
    if (data.error) metaBits.push(`<span class="warn">${esc(data.error)}</span>`);
    thinking.querySelector(".bubble").innerHTML =
      `${esc(data.answer)}<div class="meta">${metaBits.join(" · ")}</div>` +
      (cites ? `<div class="cites">${cites}</div>` : "");
    thinking.querySelectorAll(".cite").forEach(el => {
      el.onclick = () => {
        const rec = el.dataset.rec;
        const evId = el.dataset.ev;
        if (evId) showEvent(evId);
        else openSource(sources.find(x => x.record_id === rec));
      };
    });
    renderSources(data.sources);
    history.push({ role: "user", content: q });
    history.push({ role: "assistant", content: data.answer });
    if (history.length > 12) history = history.slice(-12);
  } catch (e) {
    thinking.querySelector(".bubble").textContent = "请求失败：" + e.message;
  } finally {
    $("send").disabled = false;
    $("input").focus();
    $("messages").scrollTop = $("messages").scrollHeight;
  }
});

$("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    $("form").requestSubmit();
  }
});
$("input").addEventListener("input", (ev) => {
  ev.target.style.height = "auto";
  ev.target.style.height = Math.min(180, ev.target.scrollHeight) + "px";
});
$("clearBtn").onclick = (ev) => {
  ev.preventDefault();
  history = [];
  renderSources([]);
  $("messages").innerHTML = `<div class="empty" id="empty">
      <h2>问关于实验档案的任何问题</h2>
      <p>回答只依据数据库里已归档的记录、事件、告警和 SOP，并附上可点击的 record / frame 编号。</p>
      <div class="chips" id="chips"></div>
    </div>`;
  loadSuggestions();
};

loadStats();
loadSuggestions();
$("input").focus();
</script>
</body>
</html>
